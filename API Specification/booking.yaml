openapi: 3.0.3
info:
  title: CAB System - Booking API
  version: 1.0.0
  description: Booking/assignment APIs supporting customer selection of a driver and
    vehicle in the MVP.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Bookings
paths:
  /bookings:
    get:
      tags:
      - Bookings
      summary: List bookings
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: query
        schema:
          type: integer
          format: int64
      - name: driver_id
        in: query
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - assigned
          - accepted
          - rejected
          - completed
          - cancelled
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
    post:
      tags:
      - Bookings
      summary: Create booking
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
        '409':
          description: Trip or driver is no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{bookingId}:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Bookings
      summary: Get booking
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
        '404':
          description: Not found
    patch:
      tags:
      - Bookings
      summary: Update booking
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
        '409':
          description: Invalid booking transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Bookings
      summary: Cancel booking
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Booking cancelled
        '404':
          description: Not found
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    Booking:
      type: object
      required:
      - booking_id
      - customer_id
      - trip_id
      - status
      - created_at
      properties:
        booking_id:
          type: integer
          format: int64
          example: 5001
        customer_id:
          type: integer
          format: int64
          example: 1001
        trip_id:
          type: integer
          format: int64
          example: 4001
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - pending
          - assigned
          - accepted
          - rejected
          - completed
          - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BookingCreate:
      type: object
      required:
      - customer_id
      - trip_id
      properties:
        customer_id:
          type: integer
          format: int64
        trip_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
          nullable: true
    BookingUpdate:
      type: object
      properties:
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - pending
          - assigned
          - accepted
          - rejected
          - completed
          - cancelled
      minProperties: 1
    BookingList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: CAB System SRS on GitHub
  url: https://github.com/Lacticx/23696281_NguyenLeHoangKim_CABSYSTEM/blob/main/srs.md
