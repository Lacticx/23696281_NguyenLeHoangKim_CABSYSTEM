openapi: 3.0.3
info:
  title: CAB System - Trip API
  version: 1.0.0
  description: Trip request and trip status APIs representing the SRS RIDE_REQUEST
    flow (BR-06 to BR-08).
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Trips
paths:
  /trips:
    get:
      tags:
      - Trips
      summary: List trips
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: query
        schema:
          type: integer
          format: int64
      - name: driver_id
        in: query
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        schema:
          type: string
          enum:
          - created
          - searching_driver
          - assigned
          - in_progress
          - completed
          - cancelled
      responses:
        '200':
          description: Trip list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripList'
    post:
      tags:
      - Trips
      summary: Create trip request
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tripId}:
    parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Trips
      summary: Get trip
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '404':
          description: Not found
    patch:
      tags:
      - Trips
      summary: Update trip assignment/status
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '409':
          description: Driver no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tripId}/cancel:
    post:
      tags:
      - Trips
      summary: Cancel trip
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trip cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '409':
          description: Trip cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    Trip:
      type: object
      required:
      - trip_id
      - customer_id
      - pickup_location
      - destination
      - vehicle_type_requested
      - status
      - created_at
      properties:
        trip_id:
          type: integer
          format: int64
          example: 4001
        customer_id:
          type: integer
          format: int64
          example: 1001
        driver_id:
          type: integer
          format: int64
          nullable: true
          example: 2001
        vehicle_id:
          type: integer
          format: int64
          nullable: true
          example: 3001
        pickup_location:
          type: string
          example: 227 Nguyen Van Cu, District 5, HCMC
        destination:
          type: string
          example: 1 Le Duan, District 1, HCMC
        vehicle_type_requested:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
        status:
          type: string
          enum:
          - created
          - searching_driver
          - assigned
          - in_progress
          - completed
          - cancelled
          example: created
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TripCreate:
      type: object
      required:
      - customer_id
      - pickup_location
      - destination
      - vehicle_type_requested
      properties:
        customer_id:
          type: integer
          format: int64
        pickup_location:
          type: string
          minLength: 3
        destination:
          type: string
          minLength: 3
        vehicle_type_requested:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
    TripUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - created
          - searching_driver
          - assigned
          - in_progress
          - completed
          - cancelled
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
          nullable: true
      minProperties: 1
    TripList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: CAB System SRS on GitHub
  url: https://github.com/Lacticx/23696281_NguyenLeHoangKim_CABSYSTEM/blob/main/srs.md
