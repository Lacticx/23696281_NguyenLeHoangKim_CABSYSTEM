openapi: 3.0.3
info:
  title: CAB System - Vehicle API
  version: 1.0.0
  description: Vehicle management APIs supporting driver and vehicle management in
    the MVP.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Vehicles
paths:
  /vehicles:
    get:
      tags:
      - Vehicles
      summary: List vehicles
      security:
      - bearerAuth: []
      parameters:
      - name: driver_id
        in: query
        schema:
          type: integer
          format: int64
      - name: vehicle_type
        in: query
        schema:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - maintenance
      responses:
        '200':
          description: Vehicle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleList'
    post:
      tags:
      - Vehicles
      summary: Create vehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
        '409':
          description: Plate number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vehicles/{vehicleId}:
    parameters:
    - name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Vehicles
      summary: Get vehicle
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Vehicles
      summary: Update vehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
        '409':
          description: Plate number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Vehicles
      summary: Partially update vehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
    delete:
      tags:
      - Vehicles
      summary: Deactivate vehicle
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deactivated
        '404':
          description: Not found
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    Vehicle:
      type: object
      required:
      - vehicle_id
      - driver_id
      - plate_number
      - vehicle_type
      - brand
      - model
      - status
      properties:
        vehicle_id:
          type: integer
          format: int64
          example: 3001
        driver_id:
          type: integer
          format: int64
          example: 2001
        plate_number:
          type: string
          pattern: ^[0-9]{2}[A-Z]-[0-9]{4,5}$
          example: 51A-12345
        vehicle_type:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
          example: 4_seat
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
        status:
          type: string
          enum:
          - active
          - inactive
          - maintenance
          default: active
    VehicleCreate:
      type: object
      required:
      - driver_id
      - plate_number
      - vehicle_type
      - brand
      - model
      properties:
        driver_id:
          type: integer
          format: int64
        plate_number:
          type: string
          pattern: ^[0-9]{2}[A-Z]-[0-9]{4,5}$
        vehicle_type:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
        brand:
          type: string
        model:
          type: string
    VehicleUpdate:
      type: object
      properties:
        driver_id:
          type: integer
          format: int64
        plate_number:
          type: string
          pattern: ^[0-9]{2}[A-Z]-[0-9]{4,5}$
        vehicle_type:
          type: string
          enum:
          - 4_seat
          - 7_seat
          - other
        brand:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
          - maintenance
      minProperties: 1
    VehicleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: CAB System SRS on GitHub
  url: https://github.com/Lacticx/23696281_NguyenLeHoangKim_CABSYSTEM/blob/main/srs.md
