openapi: 3.0.3
info:
  title: CAB System - User API
  description: |
    CRUD API for managing CAB System users in the MVP.

    The User resource represents both customers and drivers. The `role` field
    distinguishes between `customer` and `driver` accounts.
  version: 1.0.0
  contact:
    name: CAB System Development Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

# BR-01: Quản lý tài khoản khách hàng
# BR-02: Quản lý hồ sơ khách hàng
# BR-03: Quản lý tài khoản tài xế
# BR-04: Quản lý thông tin tài xế
# BRULE-02: Email/phone/username không được trùng
# BRULE-09: Tài khoản bị khóa/ngừng hoạt động không được sử dụng
# NFR-03: Chức năng yêu cầu tài khoản phải xác thực
# NFR-04: Chức năng quản trị phải kiểm soát quyền truy cập
# NFR-05: Bảo vệ thông tin cá nhân
# NFR-06: Lưu vết thao tác quan trọng

tags:
  - name: Users
    description: CRUD operations for customer and driver accounts

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get list of users
      description: Return a paginated list of users with optional filters.
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          description: Filter users by role
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          description: Filter users by account/driver status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: search
          in: query
          description: Search by full name, phone, or email
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a customer or driver account.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              full_name: Nguyen Van A
              phone: '0901234567'
              email: nguyenvana@example.com
              password: 'P@ssw0rd123'
              role: customer
      responses:
        '201':
          description: User created successfully
          headers:
            Location:
              description: URL of the newly created user
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email or phone already exists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUserById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Users
      summary: Update a user
      description: Replace the editable profile/account fields of an existing user.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              full_name: Nguyen Van A Updated
              phone: '0907654321'
              email: nguyenvana.updated@example.com
              role: customer
              status: active
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email or phone already exists for another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Users
      summary: Partially update a user
      description: Update one or more editable user fields.
      operationId: patchUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
            example:
              phone: '0907654321'
              status: active
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email or phone already exists for another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Users
      summary: Delete a user
      description: |
        Delete/deactivate a user account. For production, soft-delete or
        deactivation is recommended so ride history is preserved.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: User cannot be deleted because related ride data must be preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Unique user identifier
      schema:
        type: integer
        format: int64
        minimum: 1

    Page:
      name: page
      in: query
      description: Page number, starting from 1
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Number of users per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Invalid request data
            errors:
              - field: full_name
                message: Full name is required

    Unauthorized:
      description: Authentication required or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized

    Forbidden:
      description: Authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Forbidden

    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: User not found

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Internal server error

  schemas:
    UserRole:
      type: string
      description: User type in CAB System MVP
      enum:
        - customer
        - driver

    UserStatus:
      type: string
      description: |
        Account/operational status. `available` is primarily used for drivers.
      enum:
        - active
        - inactive
        - locked
        - available
        - unavailable
        - offline
      default: active

    User:
      type: object
      required:
        - user_id
        - full_name
        - phone
        - email
        - role
        - status
        - created_at
        - updated_at
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van A
        phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
          example: '0901234567'
        email:
          type: string
          format: email
          maxLength: 150
          example: nguyenvana@example.com
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-09-13T08:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-13T08:30:00Z'

    CreateUserRequest:
      type: object
      required:
        - full_name
        - phone
        - email
        - password
        - role
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    UpdateUserRequest:
      type: object
      required:
        - full_name
        - phone
        - email
        - role
        - status
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
        email:
          type: string
          format: email
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Optional password replacement

    PatchUserRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
        email:
          type: string
          format: email
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User retrieved successfully
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Users retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 50
            total_pages:
              type: integer
              example: 3

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Email is invalid
