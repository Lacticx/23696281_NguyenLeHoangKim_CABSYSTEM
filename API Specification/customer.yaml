openapi: 3.0.3
info:
  title: CAB System - Customer API
  version: 1.0.0
  description: CRUD and profile APIs for customers based on FR-CUS-01 to FR-CUS-05.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Customers
paths:
  /customers:
    get:
      tags:
      - Customers
      summary: List customers
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - locked
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '401':
          description: Unauthorized
    post:
      tags:
      - Customers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '409':
          description: Duplicate email or phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customerId}:
    parameters:
    - name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Customers
      summary: Get customer by ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Customers
      summary: Replace customer
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate email or phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Customers
      summary: Partially update customer
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Customers
      summary: Deactivate customer
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deactivated successfully
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    Customer:
      type: object
      required:
      - customer_id
      - full_name
      - phone
      - email
      - status
      - created_at
      - updated_at
      properties:
        customer_id:
          type: integer
          format: int64
          example: 1001
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van A
        phone:
          type: string
          pattern: ^0\d{9}$
          example: 0912345678
        email:
          type: string
          format: email
          example: nguyenvana@example.com
        status:
          type: string
          enum:
          - active
          - inactive
          - locked
          default: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerCreate:
      type: object
      required:
      - full_name
      - phone
      - email
      - password
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: ^0\d{9}$
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    CustomerUpdate:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: ^0\d{9}$
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - inactive
          - locked
      minProperties: 1
    CustomerList:
      type: object
      required:
      - data
      - page
      - limit
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 42
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: CAB System SRS on GitHub
  url: https://github.com/Lacticx/23696281_NguyenLeHoangKim_CABSYSTEM/blob/main/srs.md
