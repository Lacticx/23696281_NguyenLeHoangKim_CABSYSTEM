openapi: 3.0.3
info:
  title: CAB System - Trip History API
  version: 1.0.0
  description: Trip history retrieval APIs supporting BR-09 and FR-CUS-16.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Trip History
paths:
  /trip-history/customers/{customerId}:
    parameters:
    - name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Trip History
      summary: Get customer's trip history
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Trip history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryList'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trip-history/drivers/{driverId}:
    parameters:
    - name: driverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Trip History
      summary: Get driver's trip history
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Trip history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryList'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trip-history/{tripId}:
    parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Trip History
      summary: Get one historical trip
      security:
      - bearerAuth: []
      responses:
        '200':
          description: History item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TripHistoryItem'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    TripHistoryItem:
      type: object
      required:
      - trip_id
      - customer_id
      - pickup_location
      - destination
      - status
      - created_at
      properties:
        trip_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
          nullable: true
        pickup_location:
          type: string
        destination:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TripHistoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripHistoryItem'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: CAB System SRS on GitHub
  url: https://github.com/Lacticx/23696281_NguyenLeHoangKim_CABSYSTEM/blob/main/srs.md
